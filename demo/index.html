
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imuta | Learn Smarter</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #20243a;
        }

        header {
            background: #252b50;
            color: white;
            padding: 25px 7%;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 7px;
            color: #cbd0ed;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat, .panel {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000a;
        }

        .stat p {
            color: #777;
            margin-bottom: 10px;
        }

        .stat h2 {
            font-size: 30px;
            color: #5555b8;
        }

        .panel h3 {
            margin-bottom: 18px;
        }

        .subject {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .subject:last-child {
            border-bottom: none;
        }

        .subject-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 10px;
        }

        .progress {
            height: 9px;
            background: #e8e9f2;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #6565ce;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .controls {
            margin-top: 25px;
        }

        select, button {
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #ddd;
            font-size: 14px;
            margin-top: 10px;
        }

        button {
            background: #5555b8;
            color: white;
            border: none;
            cursor: pointer;
            margin-left: 5px;
        }

        button:hover {
            background: #41418f;
        }

        #message {
            margin-top: 12px;
            color: #5555b8;
        }

        @media (max-width: 650px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .subject-info {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Imuta</h1>
    <p>Learn smarter. Grow further.</p>
</header>

<main>

    <section class="welcome">
        <h2>Your Learning Dashboard</h2>
        <p>Welcome to your personal study management companion.</p>
    </section>

    <section class="stats">

        <div class="stat">
            <p>Total Subjects</p>
            <h2 id="total-subjects">0</h2>
        </div>

        <div class="stat">
            <p>Topics Completed</p>
            <h2 id="completed-topics">0</h2>
        </div>

        <div class="stat">
            <p>Overall Progress</p>
            <h2 id="overall-progress">0%</h2>
        </div>

    </section>

    <section class="panel">

        <h3>Your Subjects</h3>

        <div id="subjects-container"></div>

        <div class="controls">

            <h3>Update Your Progress</h3>

            <label for="subject-select">Choose a subject:</label>

            <select id="subject-select"></select>

            <button onclick="completeTopic()">
                Complete a Topic
            </button>

            <p id="message"></p>

        </div>

    </section>

</main>

<script>

    // Store subject information

    let subjects = [
        {
            name: "Mathematics",
            total: 5,
            completed: 3
        },
        {
            name: "Physics",
            total: 3,
            completed: 1
        },
        {
            name: "Chemistry",
            total: 2,
            completed: 1
        }
    ];


    // Calculate the total number of topics

    function getTotalTopics() {

        let total = 0;

        for (let subject of subjects) {
            total += subject.total;
        }

        return total;
    }


    // Calculate the number of completed topics

    function getCompletedTopics() {

        let completed = 0;

        for (let subject of subjects) {
            completed += subject.completed;
        }

        return completed;
    }


    // Calculate overall progress

    function getOverallProgress() {

        let total = getTotalTopics();
        let completed = getCompletedTopics();

        if (total === 0) {
            return 0;
        }

        return Math.round((completed / total) * 100);
    }


    // Display dashboard statistics

    function updateDashboard() {

        document.getElementById("total-subjects").textContent =
            subjects.length;

        document.getElementById("completed-topics").textContent =
            getCompletedTopics();

        document.getElementById("overall-progress").textContent =
            getOverallProgress() + "%";

    }


    // Display individual subjects and their progress

    function displaySubjects() {

        let container = document.getElementById("subjects-container");

        container.innerHTML = "";

        for (let i = 0; i < subjects.length; i++) {

            let subject = subjects[i];

            let percentage = subject.total === 0
                ? 0
                : (subject.completed / subject.total) * 100;

            let subjectHTML = `
                <div class="subject">

                    <div class="subject-info">

                        <strong>${subject.name}</strong>

                        <span>
                            ${subject.completed} / ${subject.total} topics
                        </span>

                    </div>

                    <div class="progress">

                        <div class="progress-bar"
                             style="width: ${percentage}%">
                        </div>

                    </div>

                </div>
            `;

            container.innerHTML += subjectHTML;
        }

    }


    // Populate the subject selection menu

    function populateSubjectSelect() {

        let select = document.getElementById("subject-select");

        select.innerHTML = "";

        for (let i = 0; i < subjects.length; i++) {

            let option = document.createElement("option");

            option.value = i;
            option.textContent = subjects[i].name;

            select.appendChild(option);
        }

    }


    // Complete a topic in the selected subject

    function completeTopic() {

        let selectedIndex =
            document.getElementById("subject-select").value;

        let subject = subjects[selectedIndex];

        let message = document.getElementById("message");

        if (subject.completed < subject.total) {

            subject.completed++;

            message.textContent =
                "Great! " + subject.name + " progress updated.";

        } else {

            message.textContent =
                "All topics in " + subject.name + " are completed!";

        }

        updateDashboard();

        displaySubjects();

    }


    // Initialise the dashboard

    populateSubjectSelect();

    updateDashboard();

    displaySubjects();

</script>

</body>
</html>
